<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jump animation study</title><style>*{box-sizing:border-box}body{margin:0;background:#eae3d5;color:#40362b;font:15px system-ui}main{max-width:900px;margin:40px auto;padding:24px}h1{font-family:Georgia,serif;font-weight:400}canvas{display:block;width:100%;background:radial-gradient(ellipse,#f7f2e8,#c1cccd);border-radius:14px}button,input{font:inherit}button{padding:9px 15px;border:1px solid #987a51;border-radius:6px;background:#fff8e9;color:#674132;cursor:pointer}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.frames button[aria-pressed=true]{background:#793b30;color:#fff0cd}p{line-height:1.7;color:#776951}a{color:#793b30}</style><main><a href="./">← Game / 返回游戏</a><h1>Jump animation / 跳跃动作</h1><canvas width="900" height="440" aria-label="Animated character preview"></canvas><nav><button id="play">Pause / 暂停</button><label>Speed / 速度 <input id="speed" type="range" min="0.25" max="1.5" step=".25" value="1"></label><span id="label"></span></nav><div class="frames"></div><p>AI-generated pose study. The game selects poses from jump velocity and landing events. This preview holds each pose longer so you can inspect the face, clothing, silhouette, and frame alignment.</p><a href="assets/swordsman-jump-v1.png">Original sprite sheet / 原始动作图集</a></main><script type="module">
const names=['Crouch / 蓄力','Push-off / 起跳','Rise / 上升','Apex / 腾空','Fall / 下落','Landing / 落地'];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),sheet=new Image();sheet.src='assets/swordsman-jump-v1.png';await sheet.decode();
const atlas=await fetch('assets/swordsman-jump-v1.json').then(r=>r.json());
let playing=true,frame=0,clock=0,last=performance.now();const buttons=names.map((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{frame=i;playing=false;document.querySelector('#play').textContent='Play / 播放';};document.querySelector('.frames').append(b);return b;});
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause / 暂停':'Play / 播放';clock=frame*.18;};
function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing){clock+=dt*Number(document.querySelector('#speed').value);frame=Math.floor(clock/.18)%6;}ctx.clearRect(0,0,900,440);ctx.fillStyle='#7c877133';ctx.beginPath();ctx.ellipse(450,393,85,12,0,0,Math.PI*2);ctx.fill();const f=atlas.frames[String(frame)].frame;const scale=360/atlas.meta.cellHeight;ctx.drawImage(sheet,f.x,f.y,f.w,f.h,450-f.w*scale/2,393-f.h*scale*.9,f.w*scale,f.h*scale);buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===frame)));document.querySelector('#label').textContent=names[frame];requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
